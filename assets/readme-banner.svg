<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Gridloom — CSS Grid playground</title><desc id="d">An animated responsive grid made from luminous modular tiles.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142b43"/><stop offset="1" stop-color="#0a1020"/></linearGradient><linearGradient id="tile"><stop stop-color="#54e0c0"/><stop offset="1" stop-color="#8fa8ff"/></linearGradient></defs><rect width="1200" height="320" rx="24" fill="url(#bg)"/><g transform="translate(72 72)" fill="url(#tile)" stroke="#b5fff0" stroke-opacity=".35"><rect width="180" height="75" rx="12"><animate attributeName="height" values="75;115;75" dur="3.4s" repeatCount="indefinite"/></rect><rect x="198" width="300" height="75" rx="12" opacity=".78"><animate attributeName="y" values="0;12;0" dur="3.4s" repeatCount="indefinite"/></rect><rect x="516" width="220" height="75" rx="12" opacity=".48"/><rect y="94" width="300" height="85" rx="12" opacity=".5"/><rect x="318" y="94" width="220" height="85" rx="12" opacity=".85"><animate attributeName="width" values="220;260;220" dur="3.4s" repeatCount="indefinite"/></rect><rect x="556" y="94" width="180" height="85" rx="12" opacity=".35"/></g><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">GRIDLOOM</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">COLUMNS / ROWS / RHYTHM</text><text x="72" y="286" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">WEAVE RESPONSIVE LAYOUTS</text></svg>