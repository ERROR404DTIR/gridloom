<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gridloom — CSS Grid Studio</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121c31;--line:#293854;--ink:#edf3ff;--muted:#91a0ba;--mint:#54e0c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#20335b,transparent 42%),var(--bg);color:var(--ink);font:14px/1.5 system-ui}header{padding:18px 5vw;border-bottom:1px solid var(--line);letter-spacing:.15em;font-weight:800}header b{color:var(--mint)}main{max-width:1300px;margin:auto;padding:34px 5vw}.eyebrow{color:var(--mint);letter-spacing:.2em;font-size:11px}h1{font-size:clamp(30px,5vw,52px);letter-spacing:-.05em;margin:8px 0}p{color:var(--muted)}.layout{display:grid;grid-template-columns:270px 1fr;gap:18px;margin-top:26px}.panel,.stage{background:#121c31eF;border:1px solid var(--line);border-radius:16px;padding:20px}.control{margin:18px 0}.control label{display:flex;justify-content:space-between;font-size:12px;color:#cbd5e8;margin-bottom:7px}output{color:var(--mint)}input,select{width:100%;accent-color:var(--mint)}select{background:#0b1325;color:var(--ink);padding:9px;border:1px solid var(--line);border-radius:8px}.actions{display:flex;gap:8px}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:8px;background:#1d2c49;color:var(--ink);cursor:pointer}.primary{background:var(--mint);color:#071b19;font-weight:700}.stagebar,.codehead{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:14px}.canvas{min-height:400px;padding:14px;border:1px dashed #526487;border-radius:12px;display:grid;gap:var(--gap);grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-template-rows:repeat(var(--rows),minmax(65px,1fr))}.tile{display:grid;place-items:center;min-height:65px;border:1px solid #667eb0;border-radius:9px;background:linear-gradient(145deg,#304879,#1a2a49);color:#cbdcff;font:10px monospace;animation:appear .35s both}@keyframes appear{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.codebox{margin-top:14px;padding:14px;background:#080e1b;border:1px solid var(--line);border-radius:10px;overflow:auto}pre{color:#9cebd4;font:12px/1.8 monospace;margin:0}.hint{font-size:11px}@media(max-width:760px){.layout{grid-template-columns:1fr}.canvas{min-height:320px}}@media(max-width:420px){main{padding:24px 4vw}.panel,.stage{padding:14px}}</style>
<header>GRID<b>LOOM</b></header><main><div class="eyebrow">LAYOUT, MADE TANGIBLE</div><h1>Weave your layout.</h1><p>Shape a responsive CSS Grid, inspect the result live, and copy clean CSS. No build step. No dependencies.</p><section class="layout"><aside class="panel"><strong>GRID SETTINGS</strong><div class="control"><label>Columns <output id="co">3</output></label><input id="cols" type="range" min="1" max="6" value="3"></div><div class="control"><label>Rows <output id="ro">3</output></label><input id="rows" type="range" min="1" max="6" value="3"></div><div class="control"><label>Gap <output id="go">12px</output></label><input id="gap" type="range" min="0" max="40" value="12"></div><div class="control"><label>Track sizing</label><select id="mode"><option value="1fr">Equal (1fr)</option><option value="auto">Content-aware (auto)</option><option value="minmax(0, 1fr)">Overflow-safe</option></select></div><div class="control"><label>Alignment</label><select id="align"><option>stretch</option><option>center</option><option>start</option><option>end</option></select></div><div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="copy">Copy CSS</button></div><p class="hint">All settings stay in this browser tab.</p></aside><div class="stage"><div class="stagebar"><span>LIVE CANVAS</span><span id="count">9 CELLS</span></div><div class="canvas" id="canvas"></div><div class="codebox"><div class="codehead"><span>GENERATED CSS</span><span>CSS</span></div><pre id="css"></pre></div></div></section></main><script>
const $=id=>document.getElementById(id);function update(){let c=+$('cols').value,r=+$('rows').value,g=+$('gap').value,m=$('mode').value,a=$('align').value;$('co').textContent=c;$('ro').textContent=r;$('go').textContent=g+'px';$('count').textContent=c*r+' CELLS';let el=$('canvas');el.style.setProperty('--cols',c);el.style.setProperty('--rows',r);el.style.setProperty('--gap',g+'px');el.style.alignItems=a;el.style.gridTemplateColumns='repeat('+c+',minmax(0,'+m+'))';el.innerHTML=Array.from({length:c*r},(_,i)=>'<div class="tile">GRID / '+String(i+1).padStart(2,'0')+'</div>').join('');$('css').textContent='.grid-container {\n  display: grid;\n  grid-template-columns: repeat('+c+', '+m+');\n  grid-template-rows: repeat('+r+', minmax(65px, 1fr));\n  gap: '+g+'px;\n  align-items: '+a+';\n}';}['cols','rows','gap','mode','align'].forEach(id=>$(id).addEventListener('input',update));$('reset').onclick=()=>{cols.value=3;rows.value=3;gap.value=12;mode.value='1fr';align.value='stretch';update()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('css').textContent);$('copy').textContent='Copied';setTimeout(()=>$('copy').textContent='Copy CSS',1200)}catch{$('copy').textContent='Select CSS'}};update();</script></html>
